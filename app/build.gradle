plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'project-report'
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.github.xckevin927.android.battery.widget"
        minSdk 21
        targetSdk 36
        versionCode 34
        versionName "3.3.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        buildConfig true
        viewBinding true
        aidl true
    }
    namespace 'com.github.xckevin927.android.battery.widget'
}



dependencies {

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'com.google.android.material:material:1.7.0'
    // 8.0 retains Android 5 support; 8.1+ raises minSdk to 23.
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'androidx.core:core-ktx:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    // Android provides org.json; JVM purchase-signature tests use its real implementation.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // android x lib
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'

    // firebase
    implementation platform('com.google.firebase:firebase-bom:30.3.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // work manager
    def work_version = "2.8.1"
    // (Java only)
    implementation("androidx.work:work-runtime:$work_version")
    // Kotlin + coroutines
    implementation("androidx.work:work-runtime-ktx:$work_version")
    // optional - GCMNetworkManager support
    implementation("androidx.work:work-gcm:$work_version")

    // third-part lib
    implementation 'com.github.QuadFlask:colorpicker:0.0.15'
    implementation 'com.alibaba:fastjson:1.1.72.android'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    implementation 'com.airbnb.android:lottie:6.0.0'
}

configurations.implementation {
    exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-ktx'
}
